# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Datasource (H2 in-memory) ─────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

auth.access-token-expiry=PT15M
auth.refresh-token-expiry=P7D
auth.email-token-expiry=PT1H
auth.authentication-token-expiry=PT10M

# Base URLs embedded in the reset-password and invitation emails
app.frontend-authorization-baseurl=http://localhost:3000/auth/verify
app.frontend-reset-baseurl=http://localhost:3000/auth/reset

spring.mail.host=smtp.example.com
spring.mail.port=587
spring.mail.username=no-reply@example.com
spring.mail.password=secret
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
